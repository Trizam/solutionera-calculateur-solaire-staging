name: calculateur-bug

on:
  repository_dispatch:
    types: [calculateur-bug]
  workflow_dispatch:
    inputs:
      bug:
        description: Description du bug
        required: true
        type: string
      name:
        description: Nom (optionnel)
        required: false
        type: string
      context_json:
        description: Contexte JSON (url, mode, version, userAgent, timestamp, calc)
        required: false
        default: "{}"
        type: string

permissions:
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create user-report issue
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            const event = context.payload || {};
            let bug = "";
            let reporter = "";
            let honeypot = "";
            let ctx = {};

            if (eventName === "workflow_dispatch") {
              const inputs = event.inputs || {};
              bug = String(inputs.bug || "").trim();
              reporter = String(inputs.name || "").trim();
              try { ctx = JSON.parse(inputs.context_json || "{}"); } catch (_) { ctx = {}; }
            } else {
              const p = event.client_payload || {};
              bug = String(p.bug || "").trim();
              reporter = String(p.name || "").trim();
              honeypot = String(p.honeypot || p.hp || "").trim();
              ctx = p.context && typeof p.context === "object" ? p.context : {};
            }

            if (honeypot) {
              core.info("ignored honeypot");
              return;
            }
            if (bug.length < 10) {
              throw new Error("bug-min");
            }

            const titleBug = bug.replace(/\s+/g, " ").slice(0, 72);
            const ua = ctx.userAgent || ctx.ua || "—";
            const ts = ctx.timestamp || ctx.ts || new Date().toISOString();
            let calcJson = "{}";
            try {
              calcJson = JSON.stringify(ctx.calc != null ? ctx.calc : {}, null, 2);
            } catch (_) {
              calcJson = "{}";
            }
            const body = [
              "## Bug",
              "",
              bug,
              "",
              "## Nom",
              "",
              reporter || "—",
              "",
              "## Contexte (auto)",
              "",
              "- **URL :** " + (ctx.url || "—"),
              "- **mode :** `" + (ctx.mode || "full") + "`",
              "- **Version :** " + (ctx.version || "—"),
              "- **User-Agent :** " + ua,
              "- **Horodatage :** " + ts,
              "",
              "```json",
              calcJson,
              "```"
            ].join("\n");

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "[user-report] " + titleBug,
              body,
              labels: ["user-report", "bug"]
            });
            core.info(issue.data.html_url);
