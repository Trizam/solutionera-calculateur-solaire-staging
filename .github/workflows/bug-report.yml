name: calculateur-bug

# Create-only: this job may only call github.rest.issues.create.
# Triggers are for coordinator tests — the public site never talks to this workflow.
on:
  workflow_dispatch:
    inputs:
      bug:
        description: Description du bug
        required: true
        type: string
      name:
        description: Nom (optionnel)
        required: false
        type: string
      context_json:
        description: Contexte JSON (url, mode, version, userAgent, timestamp, calc)
        required: false
        default: "{}"
        type: string

permissions:
  contents: read
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create user-report issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BUG_REPORT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const event = context.payload || {};
            const inputs = event.inputs || {};
            const bug = String(inputs.bug || "").trim();
            const reporter = String(inputs.name || "").trim();
            let ctx = {};
            try { ctx = JSON.parse(inputs.context_json || "{}"); } catch (_) { ctx = {}; }

            if (bug.length < 10) {
              throw new Error("bug-min");
            }

            const titleBug = bug.replace(/\s+/g, " ").slice(0, 72);
            const ua = ctx.userAgent || ctx.ua || "—";
            const ts = ctx.timestamp || ctx.ts || new Date().toISOString();
            let calcJson = "{}";
            try {
              calcJson = JSON.stringify(ctx.calc != null ? ctx.calc : {}, null, 2);
            } catch (_) {
              calcJson = "{}";
            }
            const body = [
              "## Bug",
              "",
              bug,
              "",
              "## Nom",
              "",
              reporter || "—",
              "",
              "## Contexte",
              "",
              "- **URL :** " + (ctx.url || "—"),
              "- **mode :** `" + (ctx.mode || "full") + "`",
              "- **Version :** " + (ctx.version || "—"),
              "- **User-Agent :** " + ua,
              "- **Horodatage :** " + ts,
              "",
              "```json",
              calcJson,
              "```"
            ].join("\n");

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "[user-report] " + titleBug,
              body,
              labels: ["user-report", "bug"]
            });
            core.info(issue.data.html_url);
