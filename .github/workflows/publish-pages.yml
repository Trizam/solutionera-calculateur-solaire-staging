name: publish-pages

# Pages must be enabled once in Settings (Source=GitHub Actions); workflow only publishes.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - index.html
      - favicon.ico
      - favicon.png
      - assets/**
      - docs/DESIGN.md
      - .github/workflows/publish-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage public files
        run: |
          set -euo pipefail
          mkdir -p _site/docs
          cp index.html favicon.ico favicon.png _site/
          cp -a assets _site/assets
          cp docs/DESIGN.md _site/docs/DESIGN.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
